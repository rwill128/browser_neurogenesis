name: Deploy Lab Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sim-server/public/**'
      - 'scripts/build-lab-pages.mjs'
      - '.github/workflows/lab-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lab-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static lab pages bundle
        run: node scripts/build-lab-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/labs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
